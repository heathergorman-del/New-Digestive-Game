<!DOCTYPE html>
<html>
<head>
  <title>Digestive System Game</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Roboto', sans-serif; margin: 0; padding: 0; background: #f9f9f9; text-align: center; }
    
    #controls {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 15px;
      background: #4CAF50;
      color: white;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    #controls button {
      background: white;
      color: #4CAF50;
      border: none;
      padding: 10px 25px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    #controls button:hover {
      background: #f0f0f0;
      transform: translateY(-2px);
    }

    #info {
      margin: 15px auto;
      background: #2196F3;
      color: white;
      padding: 10px 20px;
      border-radius: 10px;
      display: inline-block;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    #container {
      position: relative;
      display: inline-block;
      margin-top: 20px;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
      background: white;
      padding: 10px;
    }

    #gameImage { width: 100%; max-width: 600px; display: block; border-radius: 10px; }

    #overlay { 
      position: absolute; 
      top: 0; left: 0; width: 100%; height: 100%; 
      pointer-events: none; 
      font-size: 60px; font-weight: bold; 
      display: flex; justify-content: center; align-items: center;
      opacity: 0; transition: opacity 0.3s ease;
    }

    #overlay.show { opacity: 1; }
  </style>
</head>
<body>

<div id="controls">
  <button id="startBtn">Start Game</button>
  <button id="restartBtn">Restart Game</button>
</div>

<div id="info">
  <p>Find: <span id="organName"></span></p>
  <p>Score: <span id="score">0</span> | Attempts Left: <span id="attempts">3</span> | Time: <span id="timer">0</span>s</p>
  <p id="message"></p>
</div>

<div id="container">
  <img src="unnamed.jpg" usemap="#image-map" id="gameImage">
  <div id="overlay"></div>
</div>

<map name="image-map">

  <area alt="Gallbladder" coords="400,633,406,631,412,631,421,632,430,633,439,641,432,645,419,642,412,643,404,645,396,646,392,638" shape="poly" href="#" onclick="handleClick('Gallbladder'); return false;">

  <area alt="Mouth" coords="407,304,392,300,388,308,393,316,400,314,404,313" shape="poly" href="#" onclick="handleClick('Mouth'); return false;">
</map>

<script src="https://cdnjs.cloudflare.com/ajax/libs/image-map-resizer/1.0.10/js/imageMapResizer.min.js"></script>
<script>
window.onload = function() { imageMapResize(); };

const allOrgans = ["Mouth","Tongue","Salivary Glands","Esophagus","Stomach","Liver","Gallbladder","Pancreas","Small Intestine","Large Intestine","Appendix","Anus"];
let organs=[], currentIndex=0, score=0, attempts=3, time=0, timerInterval=null, gameStarted=false;
const overlay=document.getElementById("overlay");

function shuffle(array){ for(let i=array.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [array[i],array[j]]=[array[j],array[i]]; } return array; }

function startGame(){
  organs=shuffle([...allOrgans]); currentIndex=0; score=0; attempts=3; time=0; gameStarted=true;
  document.getElementById("score").textContent=score;
  document.getElementById("attempts").textContent=attempts;
  document.getElementById("timer").textContent=time;
  document.getElementById("message").textContent="";
  document.getElementById("organName").textContent=organs[currentIndex];
  if(timerInterval) clearInterval(timerInterval);
  timerInterval=setInterval(()=>{time++; document.getElementById("timer").textContent=time;},1000);
}

function restartGame(){ startGame(); }

function showFlash(symbol,color){
  overlay.textContent=symbol; overlay.style.color=color; overlay.classList.add('show');
  setTimeout(()=>{overlay.classList.remove('show');},500);
}

function handleClick(selected){
  if(!gameStarted) return;
  if(selected===organs[currentIndex]){
    showFlash("✅","green");
    if(attempts===3) score+=10;
    else if(attempts===2) score+=7;
    else score+=5;
    document.getElementById("score").textContent=score;
    nextOrgan();
  } else {
    attempts--;
    document.getElementById("attempts").textContent=attempts;
    showFlash("❌","red");
    if(attempts===0){
      document.getElementById("message").textContent="Out of attempts! Correct: "+organs[currentIndex];
      nextOrgan();
    }
  }
}

function nextOrgan(){
  currentIndex++; attempts=3; document.getElementById("attempts").textContent=attempts;
  if(currentIndex>=organs.length){
    clearInterval(timerInterval);
    document.getElementById("organName").textContent="Game Over!";
    document.getElementById("message").textContent="Final Score: "+score+" | Time: "+time+"s";
  } else {
    document.getElementById("organName").textContent=organs[currentIndex];
    document.getElementById("message").textContent="";
  }
}

document.getElementById("startBtn").addEventListener("click",startGame);
document.getElementById("restartBtn").addEventListener("click",restartGame);
</script>
